name: Campaign regression tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/campaign-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.js'
      - '.github/workflows/campaign-regression.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  campaign-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused campaign progression checks
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          node --test tests/campaign-navigation-smoke.test.js tests/campaign-quest-board-smoke.test.js tests/encounter-tier-distribution.test.js 2>&1 | tee campaign-focused-results.txt
      - name: Run combat endurance verification and capture report
        id: endurance
        continue-on-error: true
        run: |
          set -o pipefail
          node --test tests/combat-endurance-smoke.test.js 2>&1 | tee combat-endurance-results.txt
          grep 'Combat endurance smoke ' combat-endurance-results.txt | sed 's/^.*Combat endurance smoke /Combat endurance smoke /' > combat-endurance-metrics.jsonl || true
      - name: Extract encounter-tier distribution metrics
        if: always()
        run: |
          grep 'Encounter tier distribution ' campaign-focused-results.txt | sed 's/^.*Encounter tier distribution /Encounter tier distribution /' > encounter-tier-metrics.jsonl || true
      - name: Run multi-encounter distribution verification
        id: multi_tier
        continue-on-error: true
        run: |
          set -o pipefail
          node --test tests/encounter-tier-distribution.test.js 2>&1 | tee multi-encounter-results.txt
          grep 'Multi-encounter tier distribution ' multi-encounter-results.txt | sed 's/^.*Multi-encounter tier distribution /Multi-encounter tier distribution /' > multi-encounter-metrics.jsonl || true
      - name: Run complete Node regression suite
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee campaign-full-results.txt
      - name: Publish test logs as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-test-results
          path: |
            campaign-focused-results.txt
            campaign-full-results.txt
            combat-endurance-results.txt
            combat-endurance-metrics.jsonl
            encounter-tier-metrics.jsonl
            multi-encounter-results.txt
            multi-encounter-metrics.jsonl
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize verification results
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          ENDURANCE: ${{ steps.endurance.outcome }}
          MULTI_TIER: ${{ steps.multi_tier.outcome }}
        run: |
          echo '## Kingdom of Clays regression verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Campaign tests: $FOCUSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full suite: $FULL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Combat endurance: $ENDURANCE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multi-encounter tier distribution: $MULTI_TIER" >> "$GITHUB_STEP_SUMMARY"
          echo "### Encounter-tier distribution (400 seeds per difficulty)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s encounter-tier-metrics.jsonl ]; then
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            cat encounter-tier-metrics.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Multi-encounter tier distribution" >> "$GITHUB_STEP_SUMMARY"
          if [ -s multi-encounter-metrics.jsonl ]; then
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            cat multi-encounter-metrics.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "### Combat endurance metrics (seeded encounters)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s combat-endurance-metrics.jsonl ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat combat-endurance-metrics.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No metrics produced; inspect combat-endurance-results.txt." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Download campaign-test-results for complete test output.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish latest Node verification status to repository issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          ENDURANCE: ${{ steps.endurance.outcome }}
          MULTI_TIER: ${{ steps.multi_tier.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Automated campaign verification status"
          issue=$(gh issue list --state all --search "in:title \"$title\"" --json number,title --jq '.[] | select(.title=="Automated campaign verification status") | .number' | head -1)
          {
            echo "Latest run: $RUN_URL"
            echo
            echo "- Focused campaign tests: $FOCUSED"
            echo "- Complete Node suite: $FULL"
            echo "- Combat endurance: $ENDURANCE"
            echo "- Multi-encounter tier distribution: $MULTI_TIER"
            echo
            echo "### Encounter-tier distribution"
            if [ -s encounter-tier-metrics.jsonl ]; then
              echo '~~~'
              cat encounter-tier-metrics.jsonl
              echo '~~~'
            fi
            echo
            echo "### Multi-encounter tier distribution"
            if [ -s multi-encounter-metrics.jsonl ]; then
              echo '~~~'
              cat multi-encounter-metrics.jsonl
              echo '~~~'
            fi
            echo
            echo "### Combat endurance metrics"
            if [ -s combat-endurance-metrics.jsonl ]; then
              echo '~~~json'
              cat combat-endurance-metrics.jsonl
              echo '~~~'
            else
              echo "No metrics produced; inspect the run artifacts."
            fi
          } > verification-status.md
          if [ -z "$issue" ]; then
            gh issue create --title "$title" --body-file verification-status.md
            issue=$(gh issue list --state all --search "in:title \"$title\"" --json number,title --jq '.[] | select(.title=="Automated campaign verification status") | .number' | head -1)
          else
            gh issue edit "$issue" --body-file verification-status.md
          fi
          if [ -n "$issue" ]; then
            if [ "$FOCUSED" = success ] && [ "$FULL" = success ] && [ "$ENDURANCE" = success ] && [ "$MULTI_TIER" = success ]; then
              gh issue close "$issue" --reason completed || true
            else
              gh issue reopen "$issue" || true
            fi
          fi
      - name: Fail workflow when tests fail
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
          ENDURANCE: ${{ steps.endurance.outcome }}
          MULTI_TIER: ${{ steps.multi_tier.outcome }}
        run: |
          test "$FOCUSED" = success
          test "$FULL" = success
          test "$ENDURANCE" = success
          test "$MULTI_TIER" = success

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser test syntax
        run: |
          for file in tests/browser/*.spec.js; do node --check "$file"; done
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium gameplay regression tests
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --project=chromium --workers=2 2>&1 | tee campaign-browser-results.txt
      - name: Upload browser logs, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser-results
          path: |
            campaign-browser-results.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize browser verification
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          echo '## Chromium gameplay verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser regression tests: $BROWSER" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download campaign-browser-results for logs and failure traces.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when browser checks fail
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$BROWSER" = success
