name: Campaign regression tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused campaign progression checks
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          node --test tests/campaign-navigation-smoke.test.js tests/campaign-quest-board-smoke.test.js tests/encounter-tier-distribution.test.js 2>&1 | tee campaign-focused-results.txt
      - name: Run complete Node regression suite
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee campaign-full-results.txt
      - name: Publish test logs as downloadable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-test-results
          path: |
            campaign-focused-results.txt
            campaign-full-results.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize verification results
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: |
          echo '## Kingdom of Clays regression verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Campaign tests: $FOCUSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full suite: $FULL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download campaign-test-results for complete test output.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail workflow when tests fail
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          FULL: ${{ steps.full.outcome }}
        run: |
          test "$FOCUSED" = success
          test "$FULL" = success

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser test syntax
        run: |
          for file in tests/browser/*.spec.js; do node --check "$file"; done
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium gameplay regression tests
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test --project=chromium --workers=2 2>&1 | tee campaign-browser-results.txt
      - name: Upload browser logs, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser-results
          path: |
            campaign-browser-results.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize browser verification
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          echo '## Chromium gameplay verification' >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser regression tests: $BROWSER" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download campaign-browser-results for logs and failure traces.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when browser checks fail
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
        run: test "$BROWSER" = success
