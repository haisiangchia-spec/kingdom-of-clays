name: Campaign balance regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-balance.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-balance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  campaign-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run campaign encounter and full expedition simulations
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test tests/campaign-real-combat.test.js 2>&1 | tee test-results/campaign-balance.log
      - name: Summarize expedition outcomes
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='test-results/campaign-balance.log';
          const log=fs.existsSync(file)?fs.readFileSync(file,'utf8'):'';
          const rows=[];
          for(const line of log.split('\n')){
            const match=line.match(/Full expedition attrition\s+(\{.*\})/);
            if(!match)continue;
            try{rows.push(JSON.parse(match[1]));}catch{}
          }
          let md='## Campaign balance results\n\n';
          if(rows.length===0){
            md+='No full-expedition attrition summaries were produced. Check the test log for failures.\n';
          }else{
            md+='| Quest | Wins | Defeats | Mean fallen | Mean HP | Mean stress | Mean heals | Food left |\n';
            md+='|---|---:|---:|---:|---:|---:|---:|---:|\n';
            for(const r of rows){
              md+=`| ${r.questId} | ${r.victories}/${r.n} | ${r.defeats} | ${r.meanFallen} | ${r.meanRemainingHp} | ${r.meanStress} | ${r.meanHeals ?? 'n/a'} | ${r.meanFoodRemaining} |\n`;
            }
            md+='\n### Seed-level outcomes\n\n';
            for(const r of rows){
              md+=`**${r.questId}**: `+(r.outcomes??[]).map(o=>`${o.seed}: ${o.result} (${o.fallen} fallen)`).join(', ' )+'\n\n';
            }
            const unwinnable=rows.filter(r=>r.victories===0);
            if(unwinnable.length)md+='\n**Balance warning:** No victories in sampled seeds for: '+unwinnable.map(r=>r.questId).join(', ')+'. This is a diagnostic, not proof that a quest is impossible.\n';
            const allWins=rows.filter(r=>r.victories===r.n);
            if(allWins.length)md+='\n**Balance note:** Every sampled seed won for: '+allWins.map(r=>r.questId).join(', ')+'. Consider testing harder tactics and larger samples.\n';
            if(rows.length!==6)md+=`\n**Warning:** Expected six quest summaries, found ${rows.length}.\n`;
          }
          // Separate fully progressed Veteran/Champion results from baseline runs.
          const progressed=[];
          for(const line of log.split('\n')){
            const match=line.match(/Fully progressed expedition attrition\s+(\{.*\})/);
            if(!match)continue;
            try{progressed.push(JSON.parse(match[1]));}catch{}
          }
          md+='\n### Fully progressed Veteran and Champion expeditions\n\n';
          if(!progressed.length){
            md+='No fully progressed expedition results were produced. Check the test log.\n';
          }else{
            md+='| Quest | Wins | Defeats | Battles | Skiver fights | Four-enemy fights | Torches | Food heals | Deaths |\n';
            md+='|---|---:|---:|---:|---:|---:|---:|---:|---:|\n';
            for(const r of progressed){
              md+=`| ${r.questId} | ${r.wins}/${r.n} | ${r.defeats} | ${r.meanBattles} | ${r.meanSkiverEncounters} | ${r.meanFourEnemyEncounters} | ${r.meanTorchesUsed} | ${r.meanFoodHeals} | ${r.meanDeaths} |\n`;
              md+='\n**'+r.questId+' seed outcomes:** '+(r.outcomes??[]).map(o=>`${o.seed}: ${o.phase} (${o.battles} battles, ${o.deaths} deaths)`).join(', ')+'\n';
            }
            if(progressed.length!==2)md+='\n**Warning:** Expected two progressed quest summaries, found '+progressed.length+'.\n';
          }
          fs.writeFileSync('test-results/campaign-summary.md',md);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          NODE
      - name: Run complete regression suite
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/full-suite.log
      - name: Publish machine-readable simulation results
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p simulation-results
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log=fs.existsSync('test-results/campaign-balance.log')?fs.readFileSync('test-results/campaign-balance.log','utf8'):'';
          function extract(label){
            const entries=[];
            for(const line of log.split('\n')){
              const index=line.indexOf('# '+label+' ');
              if(index<0)continue;
              try{entries.push(JSON.parse(line.slice(index+label.length+3)));}catch{}
            }
            return entries;
          }
          const result={
            schemaVersion:1,
            commit:process.env.GITHUB_SHA,
            runId:process.env.GITHUB_RUN_ID,
            runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            baseline:extract('Full expedition attrition'),
            progressedEquipment:extract('Progressed full expedition attrition'),
            fullyProgressed:extract('Fully progressed expedition attrition')
          };
          // Refuse to replace the last useful report with an empty or partial parse.
          const expectedQuests=['crypt-recon','crypt-purge','warrens-recon','warrens-containment','warrens-veteran','warrens-champion'];
          const expectedProgressed=['warrens-veteran','warrens-champion'];
          for(const [label,rows,expected] of [
            ['baseline',result.baseline,expectedQuests],
            ['progressedEquipment',result.progressedEquipment,expectedProgressed],
            ['fullyProgressed',result.fullyProgressed,expectedProgressed]
          ]){
            const ids=rows.map(row=>row.questId);
            if(ids.length!==expected.length||new Set(ids).size!==ids.length||
               expected.some(id=>!ids.includes(id))||
               rows.some(row=>row.n!==10||!Array.isArray(row.outcomes)||row.outcomes.length!==10)){
              throw Error('Incomplete simulation report: '+label+' ('+ids.join(', ')+')');
            }
          }
          fs.writeFileSync('simulation-results/latest.json',JSON.stringify(result,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add simulation-results/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish campaign simulation results for run ${GITHUB_RUN_ID} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload campaign balance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-balance-results
          path: |
            test-results/*.log
            test-results/campaign-summary.md
          if-no-files-found: warn

  campaign-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run dungeon campaign browser regressions
        run: npx playwright test tests/browser/dungeon.spec.js --project=chromium
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
