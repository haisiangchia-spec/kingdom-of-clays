name: Campaign balance regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-balance.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/campaign-balance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  campaign-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run campaign encounter and full expedition simulations
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test tests/campaign-real-combat.test.js 2>&1 | tee test-results/campaign-balance.log
      - name: Summarize expedition outcomes
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='test-results/campaign-balance.log';
          const log=fs.existsSync(file)?fs.readFileSync(file,'utf8'):'';
          const rows=[];
          for(const line of log.split('\n')){
            const match=line.match(/Full expedition attrition\s+(\{.*\})/);
            if(!match)continue;
            try{rows.push(JSON.parse(match[1]));}catch{}
          }
          let md='## Campaign balance results\n\n';
          if(rows.length===0){
            md+='No full-expedition attrition summaries were produced. Check the test log for failures.\n';
          }else{
            md+='| Quest | Wins | Defeats | Mean fallen | Mean HP | Mean stress | Mean heals | Food left |\n';
            md+='|---|---:|---:|---:|---:|---:|---:|---:|\n';
            for(const r of rows){
              md+=`| ${r.questId} | ${r.victories}/${r.n} | ${r.defeats} | ${r.meanFallen} | ${r.meanRemainingHp} | ${r.meanStress} | ${r.meanHeals ?? 'n/a'} | ${r.meanFoodRemaining} |\n`;
            }
            md+='\n### Seed-level outcomes\n\n';
            for(const r of rows){
              md+=`**${r.questId}**: `+(r.outcomes??[]).map(o=>`${o.seed}: ${o.result} (${o.fallen} fallen)`).join(', ' )+'\n\n';
            }
            const unwinnable=rows.filter(r=>r.victories===0);
            if(unwinnable.length)md+='\n**Balance warning:** No victories in sampled seeds for: '+unwinnable.map(r=>r.questId).join(', ')+'. This is a diagnostic, not proof that a quest is impossible.\n';
            const allWins=rows.filter(r=>r.victories===r.n);
            if(allWins.length)md+='\n**Balance note:** Every sampled seed won for: '+allWins.map(r=>r.questId).join(', ')+'. Consider testing harder tactics and larger samples.\n';
            if(rows.length!==6)md+=`\n**Warning:** Expected six quest summaries, found ${rows.length}.\n`;
          }
          // Separate fully progressed Veteran/Champion results from baseline runs.
          const progressed=[];
          for(const line of log.split('\n')){
            const match=line.match(/Fully progressed expedition attrition\s+(\{.*\})/);
            if(!match)continue;
            try{progressed.push(JSON.parse(match[1]));}catch{}
          }
          md+='\n### Fully progressed Veteran and Champion expeditions\n\n';
          if(!progressed.length){
            md+='No fully progressed expedition results were produced. Check the test log.\n';
          }else{
            md+='| Quest | Wins | Defeats | Battles | Skiver fights | Four-enemy fights | Torches | Food heals | Deaths |\n';
            md+='|---|---:|---:|---:|---:|---:|---:|---:|---:|\n';
            for(const r of progressed){
              md+=`| ${r.questId} | ${r.wins}/${r.n} | ${r.defeats} | ${r.meanBattles} | ${r.meanSkiverEncounters} | ${r.meanFourEnemyEncounters} | ${r.meanTorchesUsed} | ${r.meanFoodHeals} | ${r.meanDeaths} |\n`;
              md+='\n**'+r.questId+' seed outcomes:** '+(r.outcomes??[]).map(o=>`${o.seed}: ${o.phase} (${o.battles} battles, ${o.deaths} deaths)`).join(', ')+'\n';
            }
            if(progressed.length!==2)md+='\n**Warning:** Expected two progressed quest summaries, found '+progressed.length+'.\n';
          }
          fs.writeFileSync('test-results/campaign-summary.md',md);
          if(process.env.GITHUB_STEP_SUMMARY)fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);
          NODE
      - name: Run complete regression suite
        if: always()
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/full-suite.log
      - name: Upload campaign balance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-balance-results
          path: |
            test-results/*.log
            test-results/campaign-summary.md
          if-no-files-found: warn
